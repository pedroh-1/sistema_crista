# Ambiente local: banco, arquivos (S3) e caixa de e-mail de teste.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: crista
      POSTGRES_PASSWORD: crista
      POSTGRES_DB: crista
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: crista
      MINIO_ROOT_PASSWORD: crista-dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres:
  minio:
