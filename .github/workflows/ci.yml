name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crista
          POSTGRES_PASSWORD: crista
          POSTGRES_DB: crista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crista"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://crista:crista@localhost:5432/crista_test
      DATABASE_URL_TEST: postgresql://crista:crista@localhost:5432/crista_test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx nx format:check
      - run: npx nx run-many -t lint test build
      - run: npx nx integracao api
